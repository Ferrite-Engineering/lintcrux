name: Web Deploy

# Manual-only — mirrors the rest of the suite's CI gating posture. An engineer
# clicks "Run workflow" and the live web app at app.lintcrux.app is rebuilt
# and republished.
#
# The deploy target is Cloudflare Workers Static Assets, declared in
# wrangler.jsonc (Worker `lintcrux-app`, custom domain app.lintcrux.app) — the
# same mechanism all four products use. See the note on the deploy step for
# what this workflow used to target instead, and why that was wrong.
on:
  workflow_dispatch:
    inputs:
      base_href:
        description: "Base href for the deployed app (with trailing slash)"
        required: false
        default: "/"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and deploy web viewer
    runs-on: ubuntu-latest
    # Cost guardrail: no job may run unbounded (max observed suite-wide is 29 min).
    timeout-minutes: 45
    permissions:
      # Checkout only. Publishing goes through wrangler with the Cloudflare
      # token, not through a push to this repository. `write` was left over
      # from the `gh-pages` publish described on the deploy step.
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT || github.token }}

      - name: Install Flutter (pinned)
        id: flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.3'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ steps.flutter.outputs.pub-cache-path }}
            .dart_tool/
          key: pub-web-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-web-

      - name: Enable Flutter web
        run: flutter config --enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Build web bundle
        run: |
          flutter build web \
            --release \
            --base-href "${{ inputs.base_href }}"

      - name: Smoke-test the produced bundle
        run: |
          set -euo pipefail
          test -f build/web/index.html
          test -f build/web/main.dart.js
          # The bundle must carry the locale data for all four CJK locales we
          # ship — a tree-shaking regression that dropped them would otherwise
          # only surface as English text in front of a user.
          for locale in ja ko zh; do
            grep -q "$locale" build/web/main.dart.js \
              || { echo "missing $locale locale in the web bundle"; exit 1; }
          done

      # This once published to a `gh-pages` branch through
      # peaceiris/actions-gh-pages — but LintCrux's web app is served by
      # Cloudflare Workers Static Assets from wrangler.jsonc (Worker
      # `lintcrux-app`, custom domain app.lintcrux.app), and NO `gh-pages`
      # branch has ever existed in this repo. The workflow is
      # workflow_dispatch-only, so it had likely never run to completion; had
      # it run, it would have produced a stale second copy of the app on a
      # hostname nothing points at while the live one went untouched.
      - name: Deploy to Cloudflare (lintcrux-app -> app.lintcrux.app)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "CLOUDFLARE_API_TOKEN secret and/or CLOUDFLARE_ACCOUNT_ID variable absent — the bundle was built and smoke-tested but NOT published."
            exit 0
          fi
          npx --yes wrangler@4 deploy
          echo "Deployed. Live at https://app.lintcrux.app/"
