site_name: LintCrux Documentation
site_url: https://docs.lintcrux.app/
site_description: The LintCrux user guide — installation, the interface, projects and lint engines, the violations dashboard, waivers, baselines, trends, exports, CI integration, and the EDACrux suite.
copyright: Copyright &copy; 2026 Ferrite Engineering LLC
use_directory_urls: false
docs_dir: docs

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  font: false
  palette:
    # Dark first, matching the marketing site; the toggle offers light.
    - scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
    - scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Switch to dark mode }
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra:
  homepage: https://lintcrux.app

extra_css:
  - assets/brand.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn

# `licensing.md` only forwards the old /docs/licensing URL to the suite page;
# it is reachable by URL but deliberately not listed in the navigation.
not_in_nav: |
  /licensing.md

nav:
  - Getting started:
      - Overview: index.md
      - Installation & first run: getting-started.md
      - The interface: interface.md
      - Appearance & themes: appearance-and-themes.md
      - Keyboard & mouse reference: keyboard-mouse.md
      - Tiers & licensing: https://edacrux.app/licensing
  - Linting your design:
      - Projects & engines: projects-and-engines.md
      - The violations dashboard: violations.md
      - Severity & pragmas: severity-and-pragmas.md
      - Managed waivers: waivers.md
      - Baselines & deltas: baselines.md
      - Trends & regressions: trends.md
      - Clock-domain crossings: cdc.md
  - Ship & integrate:
      - Exports & CI: exports-and-ci.md
      - Team trend database: team-database.md
      - Cross-probe & the suite: integrations.md
      - Use in VS Code: vscode.md
      - The web viewer: user-guide/web-mode.md
  - Administration:
      - Org-wide configuration: administration.md
      - Policy file reference: https://edacrux.app/policy-reference
      - Audit log: https://edacrux.app/audit-log
      - Deployment: https://edacrux.app/deployment
  - Cookbook:
      - Workflow recipes: cookbook.md
      - Triage a run & waive false positives: cookbook-triage-and-waive.md
      - Lint a FuseSoC core: cookbook-fusesoc.md
      - Gate CI on new violations: cookbook-baseline-ci.md
      - Track regressions over time: cookbook-track-regressions.md
      - Configure which engines run: cookbook-configure-engines.md
      - CI integration in depth: cookbook/ci-integration.md
  - Reference:
      - Command line: cli/invocation.md
      - Project file format: reference/project-file.md
      - Session file format: reference/session-file.md
      - Rule database: reference/rule-database.md
